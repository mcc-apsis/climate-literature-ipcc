[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "climate-literature"
description = "Measuring the size and make-up of the climate literature"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "dvc[ssh]>=3.67.1",
]

[tool.hatch]
version.source = "vcs"
build.targets.wheel.packages = [
  "src/climate_literature",
]

[tool.ruff]
lint.select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.ty]
environment.python-version = "3.14"
